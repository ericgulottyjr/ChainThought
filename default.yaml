model:
  base_model: "deepseek-ai/deepseek-llm-7b-base"
  lora:
    r: 16
    alpha: 32
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 3
  learning_rate: 3e-4
  fp16: true
  seed: 42
  output_dir: "outputs/checkpoints/"
cache:
  hf_home: "data/.hf_home"
  datasets_cache: "data/.hf_home/datasets"
wandb:
  project: "chainthought-finetune"
  entity: "bwong-boston-university"