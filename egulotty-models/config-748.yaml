# config.yaml
model:
  base_model: "deepseek-ai/deepseek-llm-7b-base"
  dropout: 0.05
  lora:
    r: 64
    alpha: 64

training:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  num_train_epochs: 5
  learning_rate: 5e-5
  lr_scheduler_type: "linear"
  warmup_ratio: 0.03
  save_strategy: "epoch"
  output_dir: "outputs/checkpoints/"
  logging_steps: 25
  seed: 42
  max_length: 2048

cache:
  hf_home: "data/.hf_home"
  datasets_cache: "data/.hf_home/datasets"

wandb:
  project: "deepseek-gsm8k-finetuned-v2"
  entity: "egulotty-boston-university"
